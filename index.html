<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Register Service Worker with update handling
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js', {
            updateViaCache: 'none'
          });

          console.log('SW registered:', registration.scope);

          // Check for updates periodically (every 1 hour)
          setInterval(() => {
            registration.update();
          }, 60 * 60 * 1000);

          // Listen for new service worker
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New content available, dispatch custom event
                  window.dispatchEvent(new CustomEvent('swUpdated', { detail: registration }));
                }
              });
            }
          });

          // Handle controller change (when new SW takes over)
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            // Only reload if we didn't trigger it ourselves
            if (!window.__swUpdating) {
              window.location.reload();
            }
          });

        } catch (err) {
          console.error('SW registration failed:', err);
        }
      });
    }

    // Global function to skip waiting on new SW
    window.skipWaiting = async () => {
      const registration = await navigator.serviceWorker.getRegistration();
      if (registration?.waiting) {
        window.__swUpdating = true;
        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
    };
  </script>
